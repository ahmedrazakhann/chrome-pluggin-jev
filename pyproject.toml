[project]
name = "twenty-chrome-plugin-jev-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.53,<0.54",
  "python-dotenv>=1.1,<2",
  "httpx[http2]>=0.28,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
